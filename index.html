<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Inventario</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>
    <h1>Formulario de Inventario</h1>
    <form id="inventoryForm">
        <label for="codigoArt">Código Artículo:</label>
        <input type="number" id="codigoArt" name="codigoArt" required>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" readonly>

       <label for="talla">Talla:</label>
<select id="talla" name="talla" required>
  <option value="">Selecciona una talla</option>
</select>

<label for="color">Color:</label>
<select id="color" name="color" required>
  <option value="">Selecciona un color</option>
</select>
        <label for="conteo">Conteo:</label>
        <input type="number" id="conteo" name="conteo" required> 

              <label for="responsable">Responsable:</label>
<select id="responsable" name="responsable" required>
  <option value="">Selecciona un responsable</option>
</select>

        <button type="button" id="guardarBtn">Guardar</button>

    </form>

</body>
</html>
