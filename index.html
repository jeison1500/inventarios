<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Inventario</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>
    <h1>Formulario de Inventario</h1>
    <form id="inventoryForm">
        <label for="codigoArt">Código Artículo:</label>
        <input type="number" id="codigoArt" name="codigoArt" required>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" readonly>

       <label for="talla">Talla:</label>
<select id="talla" name="talla" required>
  <option value="">Selecciona una talla</option>
</select>

<label for="color">Color:</label>
<select id="color" name="color" required>
  <option value="">Selecciona un color</option>
</select>
       <input
  type="number"
  id="conteo"
  min="1"
  step="1"
  required
  placeholder="Ingresa el conteo"
/>



              <label for="responsable">Responsable:</label>
<select id="responsable" name="responsable" required>
  <option value="">Selecciona un responsable</option>
</select>
<br><br>
        <button type="button" id="guardarBtn">Guardar</button> 
        <br><br><br>
        <button id="exportarBtn">📥 Exportar Excel</button>   

    </form>



    

    


  

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
    <script src="script.js"></script>


</body>
</html>
